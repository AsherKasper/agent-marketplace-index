name: daily snapshot

on:
  schedule:
    # 06:10 UTC daily. Offset from the hour because everyone crons on :00 and
    # shared runners queue there.
    - cron: "10 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Take snapshot
        run: |
          # Pass the date in explicitly so the row is stamped with the run's UTC date
          # rather than whatever the process happens to think "now" is.
          export SNAPSHOT_DATE="$(date -u +%Y-%m-%d)"
          node snapshot.mjs

      - name: Rebuild the merged time series
        # snapshot.mjs writes the CURRENT schema only; a schema change rotates that file.
        # Without this step history.csv silently stops advancing while index.csv keeps
        # looking healthy — the exact failure this file was added to fix.
        run: node merge-history.mjs

      - name: Sanity-check the series against itself
        # Lifetime cumulative columns cannot fall. If one does, the collector read something
        # different from what it read yesterday and the row is wrong — fail before committing
        # it, because a wrong row in a paid dataset is worse than a missing one.
        run: node sanity-check.mjs

      - name: Check the README still describes the data
        run: node docs-check.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "agent-marketplace-index"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # No changes is a normal outcome, not a failure.
          if git diff --staged --quiet; then
            echo "no change today"
            exit 0
          fi
          git commit -m "snapshot $(date -u +%Y-%m-%d)"
          git push
